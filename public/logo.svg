<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- chip pins -->
  <g fill="#000000">
    <!-- top -->
    <rect x="380" y="120" width="28" height="90" rx="8"/>
    <rect x="470" y="120" width="28" height="90" rx="8"/>
    <rect x="560" y="120" width="28" height="90" rx="8"/>
    <rect x="650" y="120" width="28" height="90" rx="8"/>

    <!-- bottom -->
    <rect x="380" y="814" width="28" height="90" rx="8"/>
    <rect x="470" y="814" width="28" height="90" rx="8"/>
    <rect x="560" y="814" width="28" height="90" rx="8"/>
    <rect x="650" y="814" width="28" height="90" rx="8"/>

    <!-- left -->
    <rect x="120" y="380" width="90" height="28" rx="8"/>
    <rect x="120" y="470" width="90" height="28" rx="8"/>
    <rect x="120" y="560" width="90" height="28" rx="8"/>
    <rect x="120" y="650" width="90" height="28" rx="8"/>

    <!-- right -->
    <rect x="814" y="380" width="90" height="28" rx="8"/>
    <rect x="814" y="470" width="90" height="28" rx="8"/>
    <rect x="814" y="560" width="90" height="28" rx="8"/>
    <rect x="814" y="650" width="90" height="28" rx="8"/>
  </g>

  <!-- chip body -->
  <rect x="240" y="240" width="544" height="544" rx="90" fill="#000000"/>

  <!-- inner border -->
  <rect x="320" y="320" width="384" height="384" rx="50"
        fill="none" stroke="#ffffff" stroke-width="12"/>

  <!-- N -->
  <text x="512" y="610"
        font-family="Arial, Helvetica, sans-serif"
        font-size="240"
        font-weight="700"
        text-anchor="middle"
        fill="#ffffff">N</text>
</svg>